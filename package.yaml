name: claudespaces
version: 0.1.0
github: aleperaltabazas/claudespaces

default-extensions:
  - OverloadedStrings
  - OverloadedRecordDot
  - DuplicateRecordFields
  - ScopedTypeVariables

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - containers
  - bytestring
  - cryptohash-md5
  - directory
  - file-embed
  - filepath
  - http-types
  - mtl
  - network
  - optparse-applicative
  - process
  - random
  - scotty
  - text
  - temporary
  - text-conversions
  - vector
  - time
  - unix
  - yaml

executables:
  claudespaces:
    main: app/Main.hs
    dependencies:
      - claudespaces
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

  claudespaces-bridge-server:
    main: app/Server.hs
    dependencies:
      - claudespaces
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N

library:
  source-dirs: src
  exposed-modules:
    - Claudespaces.Cli
    - Claudespaces.Config
    - Claudespaces.Container
    - Claudespaces.Env
    - Claudespaces.Error
    - Claudespaces.HostConfig
    - Claudespaces.HostServer
    - Claudespaces.Image
    - Claudespaces.Lifecycle
    - Claudespaces.Support
    - Claudespaces.Workspaces
    - Claudespaces.Workspaces.Internal

tests:
  claudespaces-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - claudespaces
      - hspec
      - hedgehog
      - hspec-hedgehog
      - temporary
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools:
      - hspec-discover
